# Azure Static Web Apps configuration
# For more information, see: https://aka.ms/swadocs

name: venuesync
api_location: ""
output_location: ".next"
app_build_command: "pnpm build"
api_build_command: ""
app_location: "/"
skip_app_build: false
skip_api_build: true

# Global build settings
build:
  app_location: "/"
  api_location: ""
  output_location: ".next"

# Environment variables
env:
  NODE_ENV: production
  NEXT_PUBLIC_SITE_URL: https://venuesync.live
  NEXT_PUBLIC_REDIRECT_URL: https://venuesync.live/auth/callback

# Routes configuration
routes:
  - route: "/api/*"
    allowedRoles: ["authenticated"]
  - route: "/dashboard/*"
    allowedRoles: ["authenticated"]
  - route: "/bookings/*"
    allowedRoles: ["authenticated"]
  - route: "/venues/*"
    allowedRoles: ["authenticated"]
  - route: "/artists/*"
    allowedRoles: ["authenticated"]
  - route: "/admin/*"
    allowedRoles: ["admin"]

# Navigation fallback
navigation_fallback:
  rewrite: "/index.html"
  exclude: ["/api/*", "/_next/*", "/static/*"]

# Global headers
global_headers:
  X-Content-Type-Options: nosniff
  X-Frame-Options: DENY
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: origin-when-cross-origin
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.spotify.com https://accounts.spotify.com; frame-src 'none';"

# MIME types
mime_types:
  .json: application/json
  .js: application/javascript
  .css: text/css
  .html: text/html
  .png: image/png
  .jpg: image/jpeg
  .jpeg: image/jpeg
  .gif: image/gif
  .svg: image/svg+xml
  .ico: image/x-icon
  .woff: font/woff
  .woff2: font/woff2
  .ttf: font/ttf
  .eot: application/vnd.ms-fontobject
